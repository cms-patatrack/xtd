name: RunUnitTest

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gcc:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner:
          - cms-patatrack-h100-47gb
          - cms-patatrack-l40s
          - cms-patatrack-mi300x
          - cms-patatrack-w7900
    runs-on: ${{ matrix.runner }}
    container: registry.cern.ch/ngt/lxplus-like:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Restore external dependencies
        uses: actions/cache@v6
        with:
          path: test/external
          key: xtd-externals-${{ hashFiles('test/Makefile') }}

      - name: Build tests
        working-directory: test
        run: |
          source /opt/intel/oneapi/setvars.sh
          make -k -j`nproc` build

      - name: Run tests
        working-directory: test
        run: |
          source /opt/intel/oneapi/setvars.sh
          make -k run

  clang:
    needs: gcc
    name: clang (${{ matrix.std }}, ${{ matrix.runner }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        runner:
          - cms-patatrack-h100-47gb
          - cms-patatrack-l40s
          - cms-patatrack-mi300x
          - cms-patatrack-w7900
        std:
          - c++20
          - c++23
    runs-on: ${{ matrix.runner }}
    container: registry.cern.ch/ngt/lxplus-like:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Setup clang
        uses: ./.github/actions/setup-clang

      - name: Restore external dependencies
        uses: actions/cache@v6
        with:
          path: test/external
          key: xtd-externals-${{ hashFiles('test/Makefile') }}

      - name: Build tests with clang (${{ matrix.std }})
        working-directory: test
        run: |
          source /opt/intel/oneapi/setvars.sh
          make -k -j`nproc` build USE_CLANG=1 CXX_STD=${{ matrix.std }}

      - name: Run tests with clang (${{ matrix.std }})
        working-directory: test
        run: |
          source /opt/intel/oneapi/setvars.sh
          make -k run USE_CLANG=1 CXX_STD=${{ matrix.std }}

  clang-avx512fp16:
    needs: gcc
    name: clang compile-only (${{ matrix.std }}, -mavx512fp16)
    strategy:
      fail-fast: false
      matrix:
        std:
          - c++20
          - c++23
    runs-on: cms-patatrack-l40s
    container: registry.cern.ch/ngt/lxplus-like:9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup toolchains
        uses: ./.github/actions/setup-toolchains

      - name: Setup clang
        uses: ./.github/actions/setup-clang

      - name: Restore external dependencies
        uses: actions/cache@v6
        with:
          path: test/external
          key: xtd-externals-${{ hashFiles('test/Makefile') }}

      - name: Build tests with clang, ${{ matrix.std }} and -mavx512fp16 (compile only)
        working-directory: test
        run: |
          source /opt/intel/oneapi/setvars.sh
          make -k -j`nproc` build USE_CLANG=1 CXX_STD=${{ matrix.std }} CPU_FLAGS=-mavx512fp16
